openapi: 3.0.3

info:
  title: Global Product API
  description: API for managing products
  version: 1.0.0

paths:

  /products:
    get:
      summary: List all products
      operationId: listProducts
      responses:
        '200':
          description: List of products

    post:
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found

    put:
      summary: Update a product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
        '404':
          description: Product not found

    delete:
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found

components:

  schemas:

    ProductInput:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          example: AWS Cloud Course
        price:
          type: number
          format: float
          example: 999
        category:
          type: string
          example: Training
