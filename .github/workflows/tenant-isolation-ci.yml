name: Phase 2 Tenant Isolation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tenant-isolation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tenant isolation regression tests
        run: python -m pytest -q tests/test_tenant_isolation_regression.py
