name: Global Product API CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest boto3 "moto==5.2.3"

      - name: Run tests
        run: python -m pytest -q tests/test_lambda_syntax.py

      - name: Package Lambda
        run: |
          mkdir -p build
          cd lambda
          zip -j ../build/GlobalProductAPI.zip lambda_function.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name GlobalProductAPI \
            --zip-file fileb://build/GlobalProductAPI.zip
